<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut" />
  <title>Khana Calorie Tracker</title>
  <meta name="description" content="Photo-based calorie and macro tracker for everyday Nepali and U.S. food." />
  <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <!-- iOS home screen -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Khana" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Main">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="32" height="32" />
        <span>Khana</span>
      </div>
      <button class="nav-btn" data-view="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Today</span>
      </button>
      <button class="nav-btn" data-view="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Log meal</span>
      </button>
      <button class="nav-btn" data-view="trends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Trends</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <main class="main">
      <section id="view-today" class="view" aria-label="Today"></section>
      <section id="view-add" class="view" hidden aria-label="Log a meal"></section>
      <section id="view-trends" class="view" hidden aria-label="Trends"></section>
      <section id="view-settings" class="view" hidden aria-label="Settings"></section>
    </main>
  </div>

  <dialog id="dlg" class="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Hidden pickers. "capture" opens the camera directly on phones. -->
  <input id="pick-camera" type="file" accept="image/*" capture="environment" hidden />
  <input id="pick-gallery" type="file" accept="image/*" hidden />
  <input id="pick-import" type="file" accept="application/json,.json" hidden />

  <noscript><p style="padding:1rem">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
